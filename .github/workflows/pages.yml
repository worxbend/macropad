# Publishes the microsite (site/ plus the pictures in docs/images/) to GitHub Pages on every push to main.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Each job gets only what it needs: the build job, which installs Pillow from PyPI, cannot deploy.
permissions:
  contents: read

# A deploy that has started always finishes; a newer push waits for it instead of cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # Pillow writes the resized WebP copies; the runner's Python is externally managed, so it
      # goes into a throwaway virtual environment. Without it the site falls back to the PNGs.
      # --only-binary: a wheel only, so no package build script runs.
      - name: make site
        run: |
          python3 -m venv "$RUNNER_TEMP/site-venv"
          "$RUNNER_TEMP/site-venv/bin/pip" install --disable-pip-version-check --only-binary=:all: pillow==11.3.0
          make site SITE_PYTHON="$RUNNER_TEMP/site-venv/bin/python"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
