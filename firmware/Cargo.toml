[workspace]
resolver = "2"
members = ["core", "sim", "uf2", "fw"]
# `fw` only builds for the microcontroller; build it from its own directory.
default-members = ["core", "sim", "uf2"]

[workspace.package]
edition = "2021"
version = "0.1.0"
publish = false

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
debug = true
