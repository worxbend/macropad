[package]
name = "macropad-fw"
description = "Macropad firmware for the RP2354A (embassy)"
edition.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "macropad"
path = "src/main.rs"
test = false
bench = false

[features]
# Logs over a debug probe (SWD) with defmt, and panics print there instead of halting quietly.
# The default build and the UF2 leave it off. `make probe` builds it; see the README.
probe = ["dep:defmt", "dep:defmt-rtt", "dep:panic-probe", "embassy-time/defmt-timestamp-uptime"]

[dependencies]
macropad-core = { path = "../core" }
cortex-m-rt = "0.7"
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread"] }
# `unstable-pac` only makes the register map public: `reset.rs` reads POWMAN CHIP_RESET with it.
embassy-rp = { version = "0.10", features = ["rp235xa", "time-driver", "critical-section-impl", "unstable-pac"] }
embassy-sync = "0.8"
embassy-time = "0.5"
embassy-usb = "0.6"
panic-halt = "1"
# The versions embassy's own examples/rp235x take with embassy-rp 0.10.
defmt = { version = "1.0.1", optional = true }
defmt-rtt = { version = "1.0", optional = true }
panic-probe = { version = "1.0", features = ["print-defmt"], optional = true }
# Same version embassy-rp's WS2812 driver takes its colour type from.
smart-leds = "0.4"
static_cell = "2"
