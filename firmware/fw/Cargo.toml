[package]
name = "macropad-fw"
description = "Macropad firmware for the RP2354A (embassy)"
edition.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "macropad"
path = "src/main.rs"
test = false
bench = false

[dependencies]
macropad-core = { path = "../core" }
cortex-m-rt = "0.7"
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread"] }
embassy-rp = { version = "0.10", features = ["rp235xa", "time-driver", "critical-section-impl"] }
embassy-sync = "0.8"
embassy-time = "0.5"
embassy-usb = "0.6"
panic-halt = "1"
# Same version embassy-rp's WS2812 driver takes its colour type from.
smart-leds = "0.4"
static_cell = "2"
